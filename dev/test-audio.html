<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalVision — Audio Module Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #1a1a1a; color: #e8e8e8; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    button { padding: 0.5rem 1rem; margin: 0.25rem; border: 1px solid #555; background: #2a2a2a; color: #e8e8e8; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input, textarea { padding: 0.5rem; border: 1px solid #555; background: #2a2a2a; color: #e8e8e8; border-radius: 4px; font-size: 0.9rem; width: 100%; margin: 0.25rem 0; font-family: inherit; }
    canvas { width: 100%; height: 80px; border: 1px solid #444; border-radius: 4px; margin-top: 0.5rem; }
    .log { background: #111; border: 1px solid #333; border-radius: 4px; padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .transcript { background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 4px; padding: 1rem; margin-top: 0.5rem; min-height: 3rem; font-size: 1rem; }
    .status { padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; font-weight: 600; }
    .status.ok { background: #1a3a1a; color: #4caf50; }
    .status.error { background: #3a1a1a; color: #f44336; }
    .status.info { background: #1a2a3a; color: #42a5f5; }
    .status.listening { background: #3a2a1a; color: #ff9800; }
    label { display: block; margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🎤 Audio Module Test</h1>
  <p>Owner: Member 4 — Test speech recognition, text-to-speech, and waveform independently.</p>
  <div class="status info" id="status">Status: Not started</div>

  <h2>Speech Recognition</h2>
  <p><small>Note: SpeechRecognition requires Chrome/Edge. May not work in Firefox.</small></p>
  <button id="btn-listen" onclick="testStartListening()">Start Listening</button>
  <button id="btn-stop-listen" onclick="testStopListening()" disabled>Stop Listening</button>
  <div class="transcript" id="transcript">Transcript will appear here...</div>

  <h2>Text-to-Speech</h2>
  <label for="tts-text">Text to speak:</label>
  <input type="text" id="tts-text" value="Welcome to DigitalVision. I can help you understand your surroundings." />
  <label for="tts-rate">Rate (0.5 - 2.0):</label>
  <input type="number" id="tts-rate" value="1.0" min="0.5" max="2.0" step="0.1" />
  <button onclick="testSpeak()">Speak</button>
  <button onclick="testStopSpeaking()">Stop Speaking</button>

  <h2>Waveform (placeholder)</h2>
  <canvas id="waveform"></canvas>

  <h2>Log</h2>
  <div class="log" id="log"></div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.textContent += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(text, type) {
      const el = document.getElementById('status');
      el.textContent = 'Status: ' + text;
      el.className = 'status ' + type;
    }

    function testStartListening() {
      if (!SpeechRecognition) {
        log('ERROR: SpeechRecognition not supported in this browser.');
        setStatus('SpeechRecognition not supported', 'error');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onstart = () => {
        log('Recognition started.');
        setStatus('Listening...', 'listening');
        document.getElementById('btn-listen').disabled = true;
        document.getElementById('btn-stop-listen').disabled = false;
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += t;
          } else {
            interim += t;
          }
        }
        const display = final ? '✅ ' + final : '🔄 ' + interim;
        document.getElementById('transcript').textContent = display;
        if (final) log('Final transcript: ' + final);
      };

      recognition.onerror = (event) => {
        log('Recognition error: ' + event.error);
        setStatus('Error: ' + event.error, 'error');
      };

      recognition.onend = () => {
        log('Recognition ended.');
        setStatus('Idle', 'info');
        document.getElementById('btn-listen').disabled = false;
        document.getElementById('btn-stop-listen').disabled = true;
      };

      recognition.start();
    }

    function testStopListening() {
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
    }

    function testSpeak() {
      const text = document.getElementById('tts-text').value;
      const rate = parseFloat(document.getElementById('tts-rate').value) || 1.0;

      if (!window.speechSynthesis) {
        log('ERROR: speechSynthesis not supported.');
        setStatus('TTS not supported', 'error');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-IN';
      utterance.rate = rate;

      utterance.onstart = () => {
        log('TTS started: "' + text.substring(0, 50) + '..."');
        setStatus('Speaking...', 'ok');
      };
      utterance.onend = () => {
        log('TTS ended.');
        setStatus('Idle', 'info');
      };
      utterance.onerror = (e) => {
        log('TTS error: ' + e.error);
        setStatus('TTS error', 'error');
      };

      window.speechSynthesis.speak(utterance);
    }

    function testStopSpeaking() {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        log('TTS cancelled.');
        setStatus('Idle', 'info');
      }
    }

    // Simple waveform placeholder
    function drawIdleWaveform() {
      const canvas = document.getElementById('waveform');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 80;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#42a5f5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.fillStyle = '#666';
      ctx.font = '12px system-ui';
      ctx.fillText('Waveform visualization — to be implemented by Member 4', 10, canvas.height / 2 - 10);
    }

    drawIdleWaveform();
    log('Audio test page loaded.');
    log('SpeechRecognition API: ' + (SpeechRecognition ? 'Available' : 'NOT AVAILABLE'));
    log('speechSynthesis API: ' + (window.speechSynthesis ? 'Available' : 'NOT AVAILABLE'));
  </script>
</body>
</html>
