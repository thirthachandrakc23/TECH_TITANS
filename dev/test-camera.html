<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalVision — Camera Module Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #1a1a1a; color: #e8e8e8; }
    h1 { font-size: 1.5rem; }
    button { padding: 0.5rem 1rem; margin: 0.25rem; border: 1px solid #555; background: #2a2a2a; color: #e8e8e8; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    video, canvas { max-width: 100%; border: 1px solid #444; border-radius: 4px; margin-top: 1rem; display: block; }
    .log { background: #111; border: 1px solid #333; border-radius: 4px; padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .status { padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; font-weight: 600; }
    .status.ok { background: #1a3a1a; color: #4caf50; }
    .status.error { background: #3a1a1a; color: #f44336; }
    .status.info { background: #1a2a3a; color: #42a5f5; }
  </style>
</head>
<body>
  <h1>📷 Camera Module Test</h1>
  <p>Owner: Member 2 — Test camera access, frame capture, and monitoring independently.</p>
  <div class="status info" id="status">Status: Not started</div>

  <div>
    <button id="btn-start" onclick="testStartCamera()">Start Camera</button>
    <button id="btn-stop" onclick="testStopCamera()" disabled>Stop Camera</button>
    <button id="btn-capture" onclick="testCaptureFrame()" disabled>Capture Frame</button>
    <button id="btn-monitor-start" onclick="testStartMonitoring()" disabled>Start Monitoring</button>
    <button id="btn-monitor-stop" onclick="testStopMonitoring()" disabled>Stop Monitoring</button>
  </div>

  <video id="preview" autoplay playsinline muted></video>
  <h2 style="font-size:1.1rem; margin-top:1rem;">Captured Frame</h2>
  <canvas id="frame-canvas" width="640" height="480"></canvas>

  <h2 style="font-size:1.1rem; margin-top:1rem;">Log</h2>
  <div class="log" id="log"></div>

  <script>
    // Standalone camera test — does NOT depend on cameraService.js
    // Tests raw browser APIs that Member 2 will wrap

    let stream = null;
    let monitorInterval = null;
    const video = document.getElementById('preview');
    const canvas = document.getElementById('frame-canvas');
    const ctx = canvas.getContext('2d');

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.textContent += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(text, type) {
      const el = document.getElementById('status');
      el.textContent = 'Status: ' + text;
      el.className = 'status ' + type;
    }

    async function testStartCamera() {
      try {
        log('Requesting camera access...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        setStatus('Camera active', 'ok');
        log('Camera started. Tracks: ' + stream.getTracks().length);
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
        document.getElementById('btn-capture').disabled = false;
        document.getElementById('btn-monitor-start').disabled = false;
      } catch (err) {
        setStatus('Camera error: ' + err.message, 'error');
        log('ERROR: ' + err.message);
      }
    }

    function testStopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
      }
      testStopMonitoring();
      setStatus('Camera stopped', 'info');
      log('Camera stopped.');
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('btn-capture').disabled = true;
      document.getElementById('btn-monitor-start').disabled = true;
    }

    function testCaptureFrame() {
      if (!stream) { log('ERROR: No active camera.'); return; }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
      log('Frame captured. Size: ~' + sizeKB + ' KB (base64)');
    }

    function testStartMonitoring() {
      if (monitorInterval) return;
      const intervalMs = 3000;
      log('Monitoring started (interval: ' + intervalMs + 'ms)');
      monitorInterval = setInterval(() => {
        testCaptureFrame();
        log('  [monitor] Frame captured automatically.');
      }, intervalMs);
      document.getElementById('btn-monitor-start').disabled = true;
      document.getElementById('btn-monitor-stop').disabled = false;
      setStatus('Monitoring active', 'ok');
    }

    function testStopMonitoring() {
      if (monitorInterval) {
        clearInterval(monitorInterval);
        monitorInterval = null;
        log('Monitoring stopped.');
        document.getElementById('btn-monitor-start').disabled = false;
        document.getElementById('btn-monitor-stop').disabled = true;
        if (stream) setStatus('Camera active (monitoring stopped)', 'ok');
      }
    }

    log('Camera test page loaded. Click "Start Camera" to begin.');
  </script>
</body>
</html>
